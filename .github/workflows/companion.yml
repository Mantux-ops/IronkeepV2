name: Companion

on:
  push:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build the window and the tests
        working-directory: companion
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          New-Item -ItemType Directory -Force out | Out-Null
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /out:out\IronkeepCompanion.exe /main:Ironkeep.App /win32manifest:app.manifest /win32icon:icon.ico /resource:sample-Ironkeep.lua,sample-Ironkeep.lua /resource:logo.png,logo.png /reference:System.Windows.Forms.dll /reference:System.Drawing.dll AssemblyInfo.cs Saved.cs Window.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $csc /nologo /target:exe /platform:anycpu /optimize+ /out:out\CompanionConsole.exe /main:Ironkeep.Program /resource:sample-Ironkeep.lua,sample-Ironkeep.lua AssemblyInfo.cs Saved.cs Program.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $csc /nologo /target:exe /out:out\CompanionTests.exe /main:Ironkeep.SavedTests /resource:sample-Ironkeep.lua,sample-Ironkeep.lua AssemblyInfo.cs Saved.cs Program.cs SavedTests.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        working-directory: companion
        run: |
          .\out\CompanionTests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = (.\out\CompanionConsole.exe --sample 2>$null) -join "`n"
          $ps = (powershell.exe -NoProfile -ExecutionPolicy Bypass -File IronkeepCompanion.ps1 --sample 2>$null) -join "`n"
          Write-Output $exe
          if ($exe -ne $ps) { Write-Error 'The reader and the script print different lists.'; exit 1 }

      - name: Build the installer
        working-directory: companion
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { exit $LASTEXITCODE }
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error 'Inno Setup compiler was not found.'; exit 1 }
          & $iscc setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Scan with Microsoft Defender
        working-directory: companion
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          try { Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent SendAllSamples -CloudBlockLevel High } catch { Write-Output "Cloud settings: $_" }
          & $mp -SignatureUpdate | Out-Host
          Get-MpComputerStatus | Format-List AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Out-Host

          $flagged = $false
          foreach ($file in @('out\IronkeepCompanion.exe', 'out\IronkeepCompanionSetup.exe')) {
            $path = (Resolve-Path $file).Path
            & $mp -Scan -ScanType 3 -File $path -DisableRemediation | Out-Host
            $code = $LASTEXITCODE
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            Write-Output "$file  exit $code  sha256 $hash"
            if ($code -ne 0) { $flagged = $true }
          }
          try { Get-MpThreatDetection | Format-List | Out-Host } catch { }
          if ($flagged) { Write-Error 'Defender flagged the new build.'; exit 1 }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: IronkeepCompanion
          path: |
            companion/out/IronkeepCompanionSetup.exe
            companion/out/IronkeepCompanion.exe
            companion/IronkeepCompanion.exe.config

      - name: Publish the download
        if: github.ref == 'refs/heads/cursor/forever-companion-f675'
        working-directory: companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-FileHash out\IronkeepCompanionSetup.exe -Algorithm SHA256).Hash
          $window = (Get-FileHash out\IronkeepCompanion.exe -Algorithm SHA256).Hash
          $notes = "Installeer IronkeepCompanionSetup.exe. Het venster leest de groepslijst en stuurt die naar de raids-pagina zodra de sleutel is ingevuld.`n`nGebouwd op Windows vanaf $env:GITHUB_SHA en daarna gescand door Microsoft Defender.`n`nSHA256 setup: $setup`nSHA256 venster: $window"
          gh release delete companion-latest --yes --cleanup-tag 2>$null
          gh release create companion-latest out\IronkeepCompanionSetup.exe out\IronkeepCompanion.exe IronkeepCompanion.exe.config --prerelease --target $env:GITHUB_SHA --title 'Ironkeep Companion' --notes $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
