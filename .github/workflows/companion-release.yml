name: Companion release

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Reviewed full commit SHA on main"
        required: true
        type: string
      publish:
        description: "Publish the immutable companion-vX.Y.Z release"
        required: true
        type: boolean
        default: false
      confirm:
        description: "Type publish to confirm. Leave empty for a dry run."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dispatch:
    permissions:
      actions: read
      contents: write
    uses: Mantux-ops/IronkeepV2/.github/workflows/companion.yml@850d60036abc738e28f82ec602b2008ecdc1920a
    with:
      source: ${{ inputs.source }}
      publish: ${{ inputs.publish }}
      confirm: ${{ inputs.confirm }}
      scripts: 850d60036abc738e28f82ec602b2008ecdc1920a
